<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="white"/>
  <defs>
    <linearGradient id="kg" gradientUnits="userSpaceOnUse" x1="256" y1="100" x2="256" y2="412">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <!-- Trazo vertical de la K -->
  <line x1="185" y1="100" x2="185" y2="412"
        stroke="url(#kg)" stroke-width="32" stroke-linecap="round"/>
  <!-- Brazo superior de la K -->
  <line x1="185" y1="256" x2="360" y2="100"
        stroke="url(#kg)" stroke-width="32" stroke-linecap="round"/>
  <!-- Brazo inferior de la K -->
  <line x1="185" y1="256" x2="360" y2="412"
        stroke="url(#kg)" stroke-width="32" stroke-linecap="round"/>
</svg>
